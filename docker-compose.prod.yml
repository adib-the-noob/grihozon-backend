version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: grihozon_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grihozon}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-grihozon}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: grihozon_redis_prod
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grihozon_api_prod
    restart: always
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - DB_NAME=${POSTGRES_DB:-grihozon}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "8000:8000"
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_admin && python manage.py seed_products 2>/dev/null || true && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grihozon_celery_prod
    restart: always
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - DB_NAME=${POSTGRES_DB:-grihozon}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: celery -A config worker -l info
    depends_on:
      api-web:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data_prod:
