# Local development docker-compose
# PostgreSQL and Celery run locally on host machine
# Only api-web and redis are containerized

services:
  redis:
    image: redis:7-alpine
    container_name: grihozon_redis_local
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grihozon_api_local
    restart: unless-stopped
    volumes:
      - ./app:/app/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DB_NAME=${POSTGRES_DB:-grihozon}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_admin && python manage.py seed_products 2>/dev/null || true && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
