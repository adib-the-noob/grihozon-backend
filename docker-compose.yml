services:
  db:
    image: postgres:16-alpine
    container_name: grihozon_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grihozon}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-grihozon}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: grihozon_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./app:/app/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=${POSTGRES_DB:-grihozon}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
